app = "language-coach"
primary_region = "sjc"
kill_signal = "SIGINT"
kill_timeout = "15s"

[env]
RUST_LOG = "info"

[[files]]
guest_path = "/app/config/production.toml"
secret_name = "SERVER_CONFIG_TOML"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

[metrics]
port = 9091
path = "/metrics"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory_mb = 256

[checks.healthz]
type = "http"
port = 8080
interval = "15s"
timeout = "2s"
method = "get"
path = "/healthz"
