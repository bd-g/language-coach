[project]
name = "language-coach"
version = "0.1.0"
description = "Bilingual English/Spanish conversation coach, as a Pipecat voice bot"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pipecat-ai[cartesia,daily,deepgram,elevenlabs,openai,runner,webrtc]==1.16.0",
    "pipecatcloud>=1.3.0",
    # daily-python 0.37 passes on_dialin_ready the whole event instead of the SIP URI
    # string, which pipecat-ai 1.16's Daily transport sends to pinlessCallUpdate as-is.
    # Lift once pipecat-ai handles the new payload.
    "daily-python>=0.36,<0.37",
    "mem0ai>=2,<3",
    "pydantic>=2.11,<3",
]

[dependency-groups]
dev = [
    "pipecat-ai[cli]==1.16.0",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN", "PT", "TC"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "TC"]

[tool.pyright]
include = ["bot.py", "language_coach", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
