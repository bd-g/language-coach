# Non-secret bot tunables. Secrets and the caller allowlist come from the
# environment (Pipecat Cloud secret set, or `.env` locally).

[session]
max_duration_seconds = 1800
time_limit_message = "Ya llegamos al límite de tiempo. We've reached the time limit. ¡Buen trabajo! Great work, see you next time."
# Spoken before ending when the speech-to-text or LLM provider fails.
failure_message = "Lo siento, algo salió mal. Sorry, something went wrong. Por favor intenta de nuevo más tarde."

# Long-term memory per phone caller and practice language, stored in Mem0.
[memory]
enabled = true
timeout_seconds = 10.0

[stt]
model = "flux-general-multi"
language_hints = ["en", "es"]

[llm]
# Pipecat quickstart default.
model = "gpt-4.1"

# Exactly one TTS provider is active. Alternatives to try (see docs/tts-providers.md):
#
#   provider = "deepgram"
#   voice = "aura-2-selena-es"
#
#   provider = "elevenlabs"
#   model = "eleven_flash_v2_5"
#   voice = "<voice-id>"
[tts]
provider = "cartesia"
model = "sonic-3.6"
# Skylar - Friendly Guide: multilingual, native en-US with an es-MX accent.
voice = "db6b0ed5-d5d3-463d-ae85-518a07d3c2b4"
# Single-accent alternative, native Mexican Spanish (English will sound accented):
# Fernanda - Friendly Guide
# voice = "b4b8e2af-6139-466e-a93a-30c20d2e1fc5"
language = "es-MX"
