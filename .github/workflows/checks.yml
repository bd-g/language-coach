name: Checks

on:
  push:
    branches:
      - main

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check formatting
        run: nix-shell --run 'cargo fmt --check'

      - name: Run clippy
        run: nix-shell --run 'cargo clippy --all-targets'

      - name: Run tests
        run: nix-shell --run 'cargo test --workspace'

  deploy:
    runs-on: ubuntu-latest
    needs: rust
    if: github.ref == 'refs/heads/main'
    env:
      FLY_APP: ${{ vars.FLY_APP || 'language-coach' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        run: fly deploy --remote-only -a "${FLY_APP}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
