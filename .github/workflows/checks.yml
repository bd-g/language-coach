name: Checks

# Required status check for pull requests into main. Deploys are done by the
# Pipecat Cloud GitHub integration when main changes, so main must only change
# through pull requests that pass this workflow.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check uv.lock matches pyproject.toml
        run: nix-shell --run 'uv lock --check'

      - name: Check formatting
        run: nix-shell --run 'ruff format --check .'

      - name: Lint
        run: nix-shell --run 'ruff check .'

      - name: Type check
        run: nix-shell --run 'pyright'

      - name: Test
        run: nix-shell --run 'pytest'
