name: Checks

on:
  push:
    branches:
      - main

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check formatting
        run: nix-shell --run 'cargo fmt --check'

      - name: Run clippy
        run: nix-shell --run 'cargo clippy --all-targets'

      - name: Run tests
        run: nix-shell --run 'cargo test --workspace'
